# Local single-box, plain-HTTP demo override.
#
# Layer this ON the cloud file so MinIO and the S3 settings stay defined once:
#   docker compose -f docker-compose.yml -f docker-compose.cloud.yml -f docker-compose.demo.yml up -d --build
#
# Tailored for a shared dev box where :80/:9000/:9001 are taken:
#   nginx  -> host :8080 (plain HTTP, /media 404s)
#   minio  -> host :19000 (S3 API), :19001 (console)
#   backend-> host :8000 (for curl/smoke tests)
# The agent runs as the `inference` container, pulling config from the cloud and
# pushing frames/incidents over the internal network (CLOUD_URL=http://backend:8000).
# Set S3_PUBLIC_ENDPOINT_URL to this host's IP so presigned URLs work from both
# the agent container and the browser.

services:
  inference:
    profiles: !reset []
    environment:
      AGENT_MODE: "1"
      AGENT_TOKEN: ${AGENT_TOKEN}
      CLOUD_URL: http://backend:8000

  nginx:
    ports: !override
      - "${HTTP_PORT:-8080}:80"
    volumes: !override
      - ./deploy/nginx.demo.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx:/etc/nginx/isosafe:ro
      - media:/data/media:ro

  backend:
    ports:
      - "8000:8000"
    environment:
      AGENT_MODE: "1"
      AGENT_TOKEN: ${AGENT_TOKEN}

  minio:
    ports: !override
      - "19000:9000"
      - "19001:9001"

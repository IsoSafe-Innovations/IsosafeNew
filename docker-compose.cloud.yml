# Cloud stack override — Phase 1a "First Cloud Demo".
#
# Usage:
#   Cloud (staging VM / local cloud check):
#     docker compose -f docker-compose.yml -f docker-compose.cloud.yml up -d --build
#
#   Original v1 stack (unchanged, inference included):
#     docker compose up -d --build
#
# This file is an OVERRIDE, not a fork. It removes services that do not
# belong on the cloud VM. Application services stay in docker-compose.yml.
#
# Excluded on the cloud VM (they run on the site/demo box instead):
#   inference  - YOLO + tracking + rules live on the agent (site) box.
#   prometheus - optional local observability, not part of the demo stack.
#   backup     - enabled separately on staging when nightly pg_dump is wired up.
#
# Re-enable with an explicit profile, e.g.:
#   docker compose -f docker-compose.yml -f docker-compose.cloud.yml --profile prometheus up -d
#
# Local S3: MinIO stands in for S3 during development (PRD v2 Phase 1a §12).
# This is the only MinIO definition. The single-box demo layers
# docker-compose.demo.yml on top of this file and only changes host ports.

services:
  # Website uploads and YouTube analysis run independently of the site agent.
  upload-worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.pipeline.runner"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-isosafe}:${POSTGRES_PASSWORD:-isosafe}@postgres:5432/${POSTGRES_DB:-isosafe}
      REDIS_URL: redis://redis:6379/0
      AGENT_MODE: "0"
      PIPELINE_UPLOADS_ONLY: "1"
      CLOUD_URL: http://backend:8000
      INFERENCE_WORKERS: "1"
      YOLO_DEVICE: cpu
      YOLO_MODEL: /data/models/yolov8n.pt
      YOLO_DETAIL_MODEL: /data/models/yolov8s.pt
      INFERENCE_THREADS: "2"
      DASHBOARD_MAX_FPS: "2"
      WORKER_MEMORY_LIMIT_MB: "1536"
      ROLE: upload-worker
    volumes:
      - media:/data/media
      - upload-models:/data/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks: [isosafe]

  inference:
    profiles: ["inference"]

  prometheus:
    profiles: ["prometheus"]

  backup:
    profiles: ["backup"]

  backend:
    environment:
      # Internal endpoint for backend ops; public endpoint is what the browser
      # and the agent use, because presigned URLs are signed for their host.
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-isosafe-snapshots}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}

  # Local S3 stand-in. Private bucket; only presigned URLs grant access.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [isosafe]

  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_started
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-isosafe-snapshots}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$$S3_ACCESS_KEY\" \"$$S3_SECRET_KEY\"; do sleep 1; done;
      mc mb -p \"local/$$S3_BUCKET\" || true;
      mc anonymous set none \"local/$$S3_BUCKET\" || true;
      "
    networks: [isosafe]

volumes:
  miniodata:
  upload-models:

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iso Safe Redesign Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@87,500;87,600;87,700;100,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Iso Safe — control-room console.
   Layout idea: grouped left rail (Monitor / Respond / Insight / System), a slim status top bar,
   then each page = header row + summary strip + work area with a persistent detail pane on the right. */
:root {
  --bg: #f4f6f9;
  --panel: #ffffff;
  --raised: #f1f4f8;
  --line: #e3e8ef;
  --line-strong: #cfd7e2;
  --ink: #111827;
  --ink-2: #475467;
  --muted: #6b7789;
  --accent: #2f5fe0;
  --accent-ink: #ffffff;
  --crit: #dc3b36;
  --warn: #c77700;
  --info: #0e8fa8;
  --ok: #1f9d5c;
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.04);
  --font-display: "Archivo", "IBM Plex Sans", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 8px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font-body); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--font-display); font-stretch: 87%; margin: 0; text-wrap: balance; letter-spacing: .005em; }
h1 { font-size: 22px; font-weight: 700; }
h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); }
h3 { font-size: 15px; font-weight: 600; }
p { margin: 0; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }
svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- preview ribbon ---------- */
.ribbon { display: flex; align-items: center; gap: 12px; padding: 6px 16px; background: repeating-linear-gradient(135deg, #eef2fb 0 10px, #e8edf8 10px 20px); border-bottom: 1px solid var(--line); font-size: 12px; color: var(--ink-2); flex-wrap: wrap; }
.ribbon b { color: var(--ink); font-weight: 600; }
.ribbon a { color: var(--accent); text-decoration: none; }
.ribbon a:hover { text-decoration: underline; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 232px 1fr; min-height: calc(100% - 31px); }
.rail { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 14px; }
.brand-mark { width: 30px; height: 30px; border-radius: 7px; background: linear-gradient(145deg, var(--accent), #3355c7); display: grid; place-items: center; color: #fff; }
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: 17px; letter-spacing: .01em; }
.brand-sub { font-size: 11px; color: var(--muted); }
.site { margin: 0 12px 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r); display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
.nav { flex: 1; overflow-y: auto; padding: 4px 10px; display: flex; flex-direction: column; gap: 14px; }
.nav-group { display: flex; flex-direction: column; gap: 2px; }
.nav-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); padding: 0 10px 4px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 6px; color: var(--ink-2); text-decoration: none; font-size: 13.5px; position: relative; }
.nav a:hover { background: var(--raised); color: var(--ink); }
.nav a.on { background: var(--raised); color: var(--ink); }
.nav a.on::before { content: ""; position: absolute; left: -10px; top: 7px; bottom: 7px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
.nav .count { margin-left: auto; font-family: var(--font-mono); font-size: 11px; padding: 1px 6px; border-radius: 10px; background: rgba(255,95,86,.16); color: var(--crit); }
.nav .count.n { background: var(--line); color: var(--ink-2); }
.rail-foot { border-top: 1px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.agent { font-size: 12px; display: grid; gap: 6px; }
.meter { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.me { display: flex; align-items: center; gap: 10px; }
.avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 600; background: #e3eaff; color: #2846a8; flex: none; }
.avatar.sm { width: 24px; height: 24px; font-size: 10.5px; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px; height: 56px; padding: 0 24px; background: rgba(255,255,255,.9); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.crumb { font-size: 13px; color: var(--muted); white-space: nowrap; }
.crumb b { color: var(--ink); font-weight: 500; }
.search { flex: 1; max-width: 460px; display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); color: var(--muted); font-size: 13px; }
.search kbd { margin-left: auto; font-family: var(--font-mono); font-size: 11px; border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 5px; }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 14px; }
.status-pill { display: flex; align-items: center; gap: 8px; font-size: 12.5px; padding: 5px 10px; border-radius: 20px; border: 1px solid var(--line); background: var(--panel); white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px rgba(52,199,123,.15); flex: none; }
.dot.crit { background: var(--crit); box-shadow: 0 0 0 3px rgba(255,95,86,.18); }
.dot.warn { background: var(--warn); box-shadow: 0 0 0 3px rgba(245,165,36,.18); }
.dot.off { background: var(--muted); box-shadow: none; }
.iconbtn { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 7px; color: var(--ink-2); position: relative; }
.iconbtn:hover { background: var(--raised); color: var(--ink); }
.iconbtn .badge { position: absolute; top: 4px; right: 4px; min-width: 15px; height: 15px; border-radius: 8px; background: var(--crit); color: #fff; font-size: 9.5px; font-weight: 600; display: grid; place-items: center; padding: 0 3px; }
.clock { font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.menu-btn { display: none; }

.page { padding: 22px 24px 40px; display: flex; flex-direction: column; gap: 18px; max-width: 1640px; width: 100%; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-head .sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* ---------- primitives ---------- */
.btn { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 13px; border-radius: 7px; border: 1px solid var(--line-strong); background: var(--raised); font-size: 13px; font-weight: 500; white-space: nowrap; }
.btn { background: var(--panel); box-shadow: 0 1px 2px rgba(16,24,40,.05); }
.btn:hover { border-color: #b8c3d1; background: var(--raised); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: #2550c4; }
.btn.ghost, .btn.danger { box-shadow: none; }
a.btn { text-decoration: none; color: var(--ink); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--raised); color: var(--ink); }
.btn.danger { background: rgba(255,95,86,.12); border-color: rgba(255,95,86,.35); color: var(--crit); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
.kpi, .cam-card, .hcard, .stab, .situation, .filterbar, .thumb { box-shadow: var(--shadow); }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px 0; }
.panel-b { padding: 14px 16px 16px; }
.link { color: var(--accent); font-size: 12.5px; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
.link:hover { text-decoration: underline; }
.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
.seg button { height: 26px; padding: 0 11px; border-radius: 5px; font-size: 12.5px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.seg button:hover { color: var(--ink); }
.seg button.on { background: var(--raised); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-strong); }
.seg .c { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.sev { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; padding: 2px 7px; border-radius: 4px; white-space: nowrap; }
.sev::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.sev.critical { color: var(--crit); background: rgba(255,95,86,.12); }
.sev.warning { color: var(--warn); background: rgba(245,165,36,.12); }
.sev.info { color: var(--info); background: rgba(76,195,217,.12); }
.sev.ok { color: var(--ok); background: rgba(52,199,123,.12); }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; padding: 2px 8px; border-radius: 4px; background: var(--raised); border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label { font-size: 11.5px; color: var(--muted); font-weight: 500; }
.input { height: 34px; width: 100%; background: var(--bg); border: 1px solid var(--line-strong); border-radius: 7px; padding: 0 10px; color: var(--ink); font: 13px var(--font-body); }
textarea.input { height: auto; padding: 8px 10px; resize: vertical; }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(90,140,255,.2); }
select.input { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 15px) 15px, calc(100% - 10px) 15px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 28px; }
.toggle { width: 34px; height: 20px; border-radius: 10px; background: var(--accent); position: relative; flex: none; }
.toggle::after { content: ""; position: absolute; top: 3px; right: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; }
.toggle.off { background: var(--line-strong); }
.toggle.off::after { right: auto; left: 3px; }
.table-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; font-weight: 500; font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 11px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t tbody tr { cursor: pointer; }
table.t tbody tr:hover td { background: var(--raised); }
table.t tr.sel td { background: rgba(47,95,224,.07); }
table.t td.stripe { padding: 0; width: 3px; }
table.t td.stripe i { display: block; width: 3px; height: 38px; }
.empty-note { color: var(--muted); font-size: 12.5px; }

/* ---------- camera feed ---------- */
.feed { position: relative; background: #000; border-radius: 8px; overflow: hidden; aspect-ratio: 16/9; }
.feed canvas { width: 100%; height: 100%; display: block; }
.feed .ov { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 8px; }
.feed .row { display: flex; justify-content: space-between; gap: 6px; align-items: flex-start; }
.ovtag { font-family: var(--font-mono); font-size: 10.5px; padding: 2px 6px; border-radius: 3px; background: rgba(5,8,12,.72); color: #dfe6ee; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.ovtag.live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--crit); animation: blink 1.4s infinite; }
.ovtag.risk-high { color: var(--crit); }
.ovtag.risk-med { color: var(--warn); }
.ovtag.risk-low { color: var(--ok); }
.feed.alerting { box-shadow: 0 0 0 2px var(--crit), 0 0 24px rgba(255,95,86,.25); }
.feed.alerting::after { content: ""; position: absolute; inset: 0; border: 2px solid var(--crit); border-radius: 8px; animation: pulse 1.6s ease-in-out infinite; pointer-events: none; }
.feed .scan { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px); pointer-events: none; }
@keyframes blink { 50% { opacity: .25; } }
@keyframes pulse { 50% { opacity: .2; } }
@media (prefers-reduced-motion: reduce) { .ovtag.live::before, .feed.alerting::after { animation: none; } }

/* ---------- dashboard ---------- */
.situation { display: grid; grid-template-columns: minmax(0, 1.4fr) repeat(3, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); }
.situation > div { padding: 14px 18px; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; justify-content: center; }
.situation > div:first-child { border-left: 0; }
.situation .alertcell { background: linear-gradient(90deg, rgba(255,95,86,.14), rgba(255,95,86,.03)); flex-direction: row; align-items: center; gap: 14px; justify-content: space-between; }
.situation .big { font-family: var(--font-display); font-size: 20px; font-weight: 600; font-stretch: 87%; }
.situation .lbl { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 13px 14px 10px; display: flex; flex-direction: column; gap: 2px; text-align: left; text-decoration: none; color: inherit; }
.kpi:hover { border-color: var(--line-strong); }
.kpi .lbl { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
.kpi .val { font-family: var(--font-display); font-size: 27px; font-weight: 600; font-stretch: 87%; font-variant-numeric: tabular-nums; line-height: 1.15; }
.kpi .d { font-size: 11.5px; font-family: var(--font-mono); }
.kpi .d.up { color: var(--ok); } .kpi .d.down { color: var(--crit); } .kpi .d.flat { color: var(--muted); }
.kpi svg.spark { width: 100%; height: 30px; margin-top: 4px; }
.dash-grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(320px, 1fr); gap: 16px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.wall { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.wall .tile:first-child { grid-column: span 2; grid-row: span 2; }
.tile { display: flex; flex-direction: column; gap: 6px; text-align: left; min-width: 0; }
.tile .cap { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 0 2px; font-size: 12.5px; }
.tile .cap b { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .cap span { color: var(--muted); font-size: 11.5px; white-space: nowrap; }
.wall .tile:first-child .feed { aspect-ratio: auto; flex: 1; min-height: 0; }
.alert-feed { display: flex; flex-direction: column; }
.alert-item { display: grid; grid-template-columns: 3px 1fr auto; gap: 12px; padding: 11px 16px; border-top: 1px solid var(--line); text-align: left; align-items: start; }
.alert-item:hover { background: var(--raised); }
.alert-item .bar { align-self: stretch; border-radius: 2px; }
.alert-item .t { font-weight: 500; font-size: 13.5px; }
.alert-item .m { font-size: 12px; color: var(--muted); margin-top: 1px; }
.alert-item time { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); }
.insight { display: grid; grid-template-columns: 26px 1fr; gap: 10px; padding: 11px 0; border-top: 1px solid var(--line); }
.insight:first-child { border-top: 0; padding-top: 0; }
.insight .ic { width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; background: rgba(90,140,255,.14); color: var(--accent); }
.insight b { font-weight: 500; font-size: 13.5px; display: block; }
.insight p { font-size: 12.5px; color: var(--ink-2); margin-top: 2px; }
.hbars { display: flex; flex-direction: column; gap: 10px; }
.hbar { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 12.5px; }
.hbar .track { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.hbar .track i { display: block; height: 100%; border-radius: 3px; }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--muted); font: 10.5px var(--font-mono); }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 3px; border-radius: 2px; display: inline-block; }

/* ---------- split layouts ---------- */
.split { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 16px; align-items: start; }
.detail { position: sticky; top: 72px; display: flex; flex-direction: column; max-height: calc(100vh - 90px); overflow: hidden; }
.detail .scroll { overflow-y: auto; }
.detail-h { padding: 16px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--line); }
.kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
.kv dt { font-size: 11.5px; color: var(--muted); }
.kv dd { margin: 2px 0 0; font-size: 13px; }
.section { padding: 16px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
.section:last-child { border-bottom: 0; }

/* cameras */
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.toolbar .input { width: 240px; }
.cam-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.cam-card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 8px; text-align: left; }
.cam-card:hover { border-color: var(--line-strong); }
.cam-card.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.cam-card .feed { border-radius: 6px; }
.cam-meta { display: flex; justify-content: space-between; gap: 8px; padding: 0 4px 2px; font-size: 12px; }
.cam-meta b { font-size: 13.5px; font-weight: 500; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cam-health { display: flex; gap: 10px; padding: 7px 4px 0; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); font-family: var(--font-mono); }
.cam-health .ok { color: var(--ok); } .cam-health .bad { color: var(--crit); }
.zone-wrap { position: relative; }
.zone-wrap svg.zones { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.rule { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.rule .rn { font-weight: 500; font-size: 13px; }
.rule .rd { font-size: 12px; color: var(--muted); grid-column: 1 / -1; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); padding: 0 16px; }
.tabs button { padding: 10px 10px; font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button.on { color: var(--ink); border-color: var(--accent); }
.tabs button:hover { color: var(--ink); }

/* alerts */
.inbox { display: flex; flex-direction: column; }
.inbox-group { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); padding: 14px 16px 6px; }
.inbox-item { display: grid; grid-template-columns: 3px 128px 1fr auto; gap: 14px; align-items: center; padding: 10px 16px 10px 0; border-top: 1px solid var(--line); text-align: left; width: 100%; }
.inbox-item:hover { background: var(--raised); }
.inbox-item.sel { background: rgba(90,140,255,.08); }
.inbox-item .bar { align-self: stretch; }
.inbox-item .feed { aspect-ratio: 16/9; border-radius: 5px; }
.inbox-item .t { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.inbox-item .t b { font-weight: 500; }
.inbox-item .d { font-size: 12.5px; color: var(--ink-2); margin-top: 3px; }
.inbox-item .r { text-align: right; font-size: 12px; color: var(--muted); }
.unread { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: inline-block; }

/* incidents */
.status-tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.stab { text-align: left; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; gap: 2px; }
.stab:hover { border-color: var(--line-strong); }
.stab.on { border-color: var(--accent); background: linear-gradient(180deg, rgba(90,140,255,.10), transparent); }
.stab .n { font-family: var(--font-display); font-size: 24px; font-weight: 600; font-stretch: 87%; }
.stab .l { font-size: 12.5px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.age { font-family: var(--font-mono); font-size: 12px; }
.age.late { color: var(--warn); }
.timeline { display: flex; flex-direction: column; gap: 0; }
.tl { display: grid; grid-template-columns: 14px 1fr; gap: 10px; position: relative; padding-bottom: 14px; }
.tl::before { content: ""; position: absolute; left: 6px; top: 14px; bottom: 0; width: 1px; background: var(--line-strong); }
.tl:last-child::before { display: none; }
.tl .pt { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--line-strong); background: var(--panel); margin-top: 3px; }
.tl .pt.a { border-color: var(--accent); }
.tl .pt.c { border-color: var(--crit); }
.tl b { font-weight: 500; font-size: 13px; }
.tl p { font-size: 12px; color: var(--muted); }

/* analytics */
.filterbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.filterbar .input { width: 200px; }
.summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.summary .kpi .val { font-size: 24px; }
.charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.heat { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; align-items: center; }
.scale { height: 8px; border-radius: 4px; background: linear-gradient(90deg, rgba(76,195,217,.25), #f5a524, #ff5f56); }

/* reports */
.reports { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; align-items: start; }
.rep-list { display: flex; flex-direction: column; }
.rep { display: grid; grid-template-columns: 40px 1fr auto; gap: 14px; align-items: center; padding: 14px 16px; border-top: 1px solid var(--line); text-align: left; width: 100%; }
.rep:first-child { border-top: 0; }
.rep:hover { background: var(--raised); }
.rep.sel { background: rgba(90,140,255,.08); }
.rep .ic { width: 40px; height: 40px; border-radius: 8px; background: var(--raised); border: 1px solid var(--line); display: grid; place-items: center; color: var(--accent); }
.rep b { font-weight: 500; }
.rep p { font-size: 12.5px; color: var(--muted); }
.paper { background: #fbfaf7; color: #1b1f24; border: 1px solid var(--line); border-radius: 6px; padding: 18px; font-size: 10px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 6px 20px rgba(16,24,40,.10); }
.paper h4 { margin: 0; font: 600 14px var(--font-display); }
.paper .pk { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.paper .pk div { border: 1px solid #d8d4cb; border-radius: 3px; padding: 6px; }
.paper .pk b { display: block; font: 600 14px var(--font-display); }
.paper .rows div { display: flex; justify-content: space-between; border-bottom: 1px solid #e2ded6; padding: 3px 0; }

/* investigations */
.query { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)) auto; gap: 10px; align-items: end; padding: 14px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 14px 14px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 6px 3px 9px; border-radius: 14px; background: rgba(47,95,224,.08); color: var(--accent); border: 1px solid rgba(47,95,224,.25); }

.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.thumb { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px; display: flex; flex-direction: column; gap: 6px; }
.thumb .feed { border-radius: 5px; }
.thumb .m { font-size: 11.5px; color: var(--muted); padding: 0 3px 3px; display: flex; justify-content: space-between; gap: 6px; }
.plate { font-family: var(--font-mono); font-weight: 500; color: #111; background: #f1d36b; padding: 1px 6px; border-radius: 3px; font-size: 12px; letter-spacing: .04em; }
.conf { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 12px; }
.conf i { width: 44px; height: 4px; border-radius: 2px; background: var(--line); position: relative; overflow: hidden; }
.conf i::after { content: ""; position: absolute; inset: 0; width: var(--w); background: var(--ok); }

/* assistant */
.chat-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.chat { display: flex; flex-direction: column; min-height: 640px; }
.msgs { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 18px; }
.msg-u { align-self: flex-end; max-width: 70%; background: rgba(90,140,255,.14); border: 1px solid rgba(90,140,255,.3); padding: 9px 13px; border-radius: 12px 12px 3px 12px; }
.msg-a { display: grid; grid-template-columns: 30px 1fr; gap: 12px; max-width: 92%; }
.msg-a .av { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(145deg, var(--accent), #3355c7); display: grid; place-items: center; color: #fff; }
.msg-a .body { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.sql { font-family: var(--font-mono); font-size: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 10px 12px; color: #2846a8; overflow-x: auto; white-space: pre; }
details.sqlbox summary { cursor: pointer; font-size: 12px; color: var(--muted); list-style: none; display: inline-flex; gap: 6px; align-items: center; }
details.sqlbox summary::-webkit-details-marker { display: none; }
details.sqlbox[open] summary { margin-bottom: 8px; }
.composer { border-top: 1px solid var(--line); padding: 14px; display: flex; gap: 10px; }
.composer .input { height: 42px; font-size: 14px; }
.suggest { display: flex; flex-direction: column; gap: 6px; }
.suggest button { text-align: left; font-size: 13px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink-2); background: var(--bg); }

.privacy { display: grid; grid-template-columns: 18px 1fr; gap: 10px; font-size: 12.5px; color: var(--ink-2); padding: 12px; border-radius: 8px; background: rgba(52,199,123,.07); border: 1px solid rgba(52,199,123,.22); }
.privacy svg { color: var(--ok); }

/* admin */
.health-cards { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.hcard { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 13px 14px; display: flex; flex-direction: column; gap: 6px; }
.hcard .top { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; color: var(--ink-2); }
.hcard .v { font-family: var(--font-display); font-size: 20px; font-weight: 600; font-stretch: 87%; }
.hcard .s { font-size: 11.5px; color: var(--muted); font-family: var(--font-mono); }
.res { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.res .meter { height: 6px; margin-top: 6px; }
.role { font-size: 11.5px; padding: 2px 8px; border-radius: 10px; font-weight: 500; }

.progress { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }

/* login */
.login { min-height: calc(100vh - 31px); display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(380px, .85fr); }
.login-art { position: relative; overflow: hidden; border-right: 1px solid var(--line); background: #06080b; color: #f2f5f9; }

.login-art .veil { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(6,8,11,.92) 0%, rgba(6,8,11,.55) 60%, rgba(6,8,11,.85) 100%), linear-gradient(0deg, rgba(6,8,11,.95), transparent 45%); }
.login-art .copy { position: absolute; left: 48px; bottom: 48px; right: 48px; max-width: 520px; display: flex; flex-direction: column; gap: 14px; }

.login-art .copy p { color: #c3ccd8; font-size: 15px; max-width: 46ch; }
.login-art .facts { display: flex; gap: 22px; margin-top: 8px; flex-wrap: wrap; }
.login-art .facts div { font-size: 12px; color: #8f9bab; }
.login-art .facts b { display: block; font-family: var(--font-display); font-size: 20px; color: #fff; font-weight: 600; }
.login-form { display: flex; align-items: center; justify-content: center; padding: 40px 24px; background: var(--panel); }
.login-form form { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 16px; }
.login-form .input { height: 42px; font-size: 14px; }
.login-form .btn.primary { height: 42px; justify-content: center; font-size: 14px; }

/* ---------- design notes ---------- */
.notes { position: fixed; right: 18px; bottom: 18px; z-index: 50; width: 330px; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: 0 12px 32px rgba(16,24,40,.14); font-size: 12.5px; }
.notes-h { display: flex; justify-content: space-between; align-items: center; padding: 11px 14px; border-bottom: 1px solid var(--line); }
.notes-h b { font-weight: 600; display: flex; gap: 8px; align-items: center; }
.notes ul { margin: 0; padding: 12px 14px 14px 30px; display: flex; flex-direction: column; gap: 6px; color: var(--ink-2); }
.notes.min { width: auto; }
.notes.min ul { display: none; }
.notes.min .notes-h { border-bottom: 0; }

/* ---------- responsive ---------- */
@media (max-width: 1280px) {
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .health-cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .query { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 1100px) {
  .dash-grid, .split, .reports, .chat-wrap { grid-template-columns: minmax(0, 1fr); }
  .detail { position: static; max-height: none; }
  .situation { grid-template-columns: 1fr 1fr; }
  .situation > div:nth-child(3) { border-left: 0; }
  .situation > div:nth-child(n+3) { border-top: 1px solid var(--line); }
  .charts, .heat { grid-template-columns: minmax(0, 1fr); }
  .notes { display: none; }
}
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { position: fixed; left: 0; top: 0; z-index: 60; width: 260px; transform: translateX(-100%); transition: transform .2s; box-shadow: 20px 0 50px rgba(16,24,40,.18); }
  .rail.open { transform: none; }
  .menu-btn { display: grid; }
  .topbar { padding: 0 16px; gap: 10px; }
  .search, .status-pill, .crumb { display: none; }
  .page { padding: 18px 16px 32px; }
  .login { grid-template-columns: minmax(0, 1fr); }
  .login-art { min-height: 320px; }
  .login-art .copy { left: 20px; right: 20px; bottom: 24px; }
  .login-art .copy h1 { font-size: 28px; }
  .status-tabs, .summary, .res { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 560px) {
  .kpis, .health-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .situation, .query { grid-template-columns: minmax(0, 1fr); }
  .situation > div { border-left: 0; border-top: 1px solid var(--line); }
  .situation > div:first-child { border-top: 0; }
  .wall { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .inbox-item { grid-template-columns: 3px 84px 1fr; }
  .inbox-item .r { display: none; }
  .toolbar .input, .filterbar .input { width: 100%; }
  .clock { display: none; }
}
</style>
</head>

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const sevColor = s => ({ critical: 'var(--crit)', warning: 'var(--warn)', info: 'var(--info)' }[s] || 'var(--ok)');
const fmt = n => new Intl.NumberFormat('en-US').format(n);
function nice(max, ticks = 4) { const raw = max / ticks || 1; const p = 10 ** Math.floor(Math.log10(raw)); const step = [1, 2, 2.5, 5, 10].find(m => m * p >= raw) * p; return { step, top: step * ticks }; }

function feed(cam, opts = {}) {
  const c = typeof cam === 'string' ? camById[cam] : cam;
  const risk = c.risk === 'high' ? 'HIGH' : c.risk === 'med' ? 'MED' : 'LOW';
  const alerting = opts.alert ?? c.alert;
  const top = opts.bare ? '' : `<div class="row">
      <span style="display:flex;gap:5px;flex-wrap:wrap">${c.upload ? '<span class="ovtag" style="color:var(--info)">UPLOAD · LOOP</span>' : c.online ? '<span class="ovtag live">LIVE</span>' : '<span class="ovtag" style="color:var(--crit)">OFFLINE</span>'}${c.online ? `<span class="ovtag risk-${c.risk}">RISK ${risk}</span>` : ''}</span>
      ${opts.big ? `<span class="ovtag" data-clock>14:32:07</span>` : ''}
    </div>`;
  const bottom = opts.bare ? '' : `<div class="row" style="align-items:flex-end">
      <span class="ovtag">${ic('users', 'style="width:11px;height:11px"')} ${c.people} &nbsp;${ic('car', 'style="width:11px;height:11px"')} ${c.vehicles}</span>
      ${opts.big ? `<span class="ovtag">${c.name.toUpperCase()}</span>` : ''}
    </div>`;
  return `<div class="feed ${alerting ? 'alerting' : ''}" ${opts.style ? `style="${opts.style}"` : ''}>
    <canvas data-feed="${c.id}" ${opts.alert ? 'data-alert="1"' : ''} ${opts.heat ? 'data-heat="1"' : ''} ${opts.seed ? `data-seed="${opts.seed}"` : ''} aria-label="${c.name} camera view" role="img"></canvas>
    <div class="scan"></div>
    <div class="ov">${top}${bottom}</div>
  </div>`;
}

function drawFeed(cv, t) {
  const c = camById[cv.dataset.feed]; if (!c) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = cv.clientWidth, H = cv.clientHeight; if (!W || !H) return;
  if (cv.width !== Math.round(W * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  const x = cv.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0);
  const r = rng(Number(cv.dataset.seed) || c.seed);
  const outdoor = ['gate', 'parking', 'perimeter'].includes(c.scene);
  const ir = c.ir;
  if (!c.online) {
    x.fillStyle = '#07090c'; x.fillRect(0, 0, W, H);
    for (let i = 0; i < W * H / 40; i++) { const v = 20 + r() * 40 | 0; x.fillStyle = `rgb(${v},${v},${v})`; x.fillRect(r() * W, r() * H, 1.4, 1.4); }
    x.fillStyle = 'rgba(0,0,0,.55)'; x.fillRect(0, H / 2 - 14, W, 28);
    x.fillStyle = '#ff8a84'; x.font = `500 ${Math.max(10, W / 30)}px "IBM Plex Mono", monospace`; x.textAlign = 'center'; x.fillText('NO SIGNAL', W / 2, H / 2 + 4); x.textAlign = 'left';
    return;
  }
  const hz = H * (outdoor ? 0.34 : 0.4);
  const pal = ir ? ['#1d2421', '#3c4642', '#2b3330'] : outdoor ? ['#3a4650', '#2e3337', '#40494f'] : c.scene === 'lobby' ? ['#3d3a36', '#5b5650', '#4a4640'] : ['#30353a', '#4a4e50', '#3b4044'];
  let g = x.createLinearGradient(0, 0, 0, hz); g.addColorStop(0, pal[0]); g.addColorStop(1, pal[2]); x.fillStyle = g; x.fillRect(0, 0, W, hz);
  g = x.createLinearGradient(0, hz, 0, H); g.addColorStop(0, pal[2]); g.addColorStop(1, pal[1]); x.fillStyle = g; x.fillRect(0, hz, W, H - hz);
  const vx = W * (0.35 + r() * 0.3);
  x.strokeStyle = 'rgba(255,255,255,.07)'; x.lineWidth = 1;
  for (let i = -6; i <= 6; i++) { x.beginPath(); x.moveTo(vx, hz); x.lineTo(vx + i * W * 0.22, H); x.stroke(); }
  for (let k = 1; k < 6; k++) { const yy = hz + (H - hz) * (k / 6) ** 1.6; x.beginPath(); x.moveTo(0, yy); x.lineTo(W, yy); x.stroke(); }
  // structures
  if (outdoor) {
    for (let i = 0; i < 5; i++) { const bw = W * (0.1 + r() * 0.18), bx = r() * W, bh = hz * (0.3 + r() * 0.5); x.fillStyle = `rgba(20,24,28,${0.5 + r() * 0.3})`; x.fillRect(bx, hz - bh, bw, bh); }
    x.strokeStyle = 'rgba(240,220,150,.35)'; x.setLineDash([10, 10]); x.lineWidth = 2;
    x.beginPath(); x.moveTo(vx, hz); x.lineTo(vx - W * 0.1, H); x.stroke(); x.setLineDash([]);
    if (c.scene === 'perimeter') { x.strokeStyle = 'rgba(200,210,205,.18)'; x.lineWidth = 1; for (let i = 0; i < W; i += 7) { x.beginPath(); x.moveTo(i, hz - 26); x.lineTo(i + 10, hz + 6); x.stroke(); } }
  } else {
    const shelf = c.scene === 'aisle' || c.scene === 'dock';
    for (const side of [0, 1]) {
      x.fillStyle = shelf ? 'rgba(24,28,32,.75)' : 'rgba(255,255,255,.04)';
      x.beginPath();
      if (side === 0) { x.moveTo(0, hz * 0.2); x.lineTo(W * 0.24, hz * 0.7); x.lineTo(W * 0.24, hz + 4); x.lineTo(0, H * 0.82); }
      else { x.moveTo(W, hz * 0.2); x.lineTo(W * 0.78, hz * 0.7); x.lineTo(W * 0.78, hz + 4); x.lineTo(W, H * 0.82); }
      x.closePath(); x.fill();
      if (shelf) { x.strokeStyle = 'rgba(245,165,36,.22)'; x.lineWidth = 2; for (let k = 1; k < 4; k++) { x.beginPath(); const yy = k / 4; x.moveTo(side ? W : 0, hz * 0.2 + (H * 0.82 - hz * 0.2) * yy); x.lineTo(side ? W * 0.78 : W * 0.24, hz * 0.7 + (hz + 4 - hz * 0.7) * yy); x.stroke(); } }
    }
    if (c.scene === 'dock') { x.fillStyle = 'rgba(10,12,14,.8)'; x.fillRect(W * 0.38, hz * 0.35, W * 0.24, hz * 0.65); x.fillStyle = 'rgba(245,165,36,.5)'; for (let i = 0; i < 6; i++) x.fillRect(W * 0.38 + i * W * 0.04, hz - 4, W * 0.02, 4); }
    if (c.scene === 'lobby') { x.fillStyle = 'rgba(255,240,210,.08)'; x.fillRect(W * 0.3, hz * 0.15, W * 0.4, hz * 0.5); }
  }
  const boxes = [];
  const obj = (kind, i) => {
    const depth = 0.15 + r() * 0.8;
    const y = hz + (H - hz) * depth;
    const s = 0.35 + depth * 0.85;
    const jitter = Math.sin(t / 900 + i * 1.7) * 3 * s;
    let px = W * (0.12 + r() * 0.76) + jitter;
    if (kind === 'person') {
      const ph = H * 0.3 * s, pw = ph * 0.34;
      x.fillStyle = ir ? 'rgba(210,225,215,.55)' : 'rgba(14,16,20,.85)';
      x.beginPath(); x.roundRect(px - pw / 2, y - ph * 0.82, pw, ph * 0.82, pw * 0.35); x.fill();
      x.beginPath(); x.arc(px, y - ph * 0.9, ph * 0.1, 0, Math.PI * 2); x.fill();
      boxes.push({ kind, x: px - pw * 0.75, y: y - ph * 1.04, w: pw * 1.5, h: ph * 1.06, s });
    } else {
      const vh = H * 0.15 * s, vw = vh * 2.1;
      x.fillStyle = ir ? 'rgba(200,215,205,.45)' : `rgba(${30 + r() * 60 | 0},${34 + r() * 40 | 0},${40 + r() * 40 | 0},.95)`;
      x.beginPath(); x.roundRect(px - vw / 2, y - vh, vw, vh * 0.8, vh * 0.2); x.fill();
      x.beginPath(); x.roundRect(px - vw * 0.3, y - vh * 1.3, vw * 0.6, vh * 0.4, vh * 0.15); x.fill();
      x.fillStyle = 'rgba(0,0,0,.6)'; x.fillRect(px - vw * 0.4, y - vh * 0.25, vw * 0.18, vh * 0.25); x.fillRect(px + vw * 0.22, y - vh * 0.25, vw * 0.18, vh * 0.25);
      boxes.push({ kind: c.scene === 'gate' && i === 0 ? 'truck' : 'car', x: px - vw * 0.56, y: y - vh * 1.4, w: vw * 1.12, h: vh * 1.45, s });
    }
  };
  for (let i = 0; i < c.vehicles; i++) obj('vehicle', i);
  for (let i = 0; i < c.people; i++) obj('person', i + 10);
  const alertBox = cv.dataset.alert || c.alert;
  boxes.sort((a, b) => a.y + a.h - (b.y + b.h)).forEach((b, i) => {
    const hot = alertBox && i === boxes.length - 1 && b.kind === 'person';
    const col = hot ? '#ff5f56' : b.kind === 'person' ? '#7ea4ff' : '#f5b84a';
    x.strokeStyle = col; x.lineWidth = hot ? 2 : 1.3; x.strokeRect(b.x, b.y, b.w, b.h);
    const fs = Math.max(8.5, Math.min(11, W / 42));
    x.font = `500 ${fs}px "IBM Plex Mono", monospace`;
    const label = `${b.kind} ${(0.8 + r() * 0.19).toFixed(2)}`;
    const tw = x.measureText(label).width + 6;
    if (W > 150) { x.fillStyle = col; x.fillRect(b.x, b.y - fs - 3, tw, fs + 3); x.fillStyle = '#0a0d12'; x.fillText(label, b.x + 3, b.y - 3.5); }
  });
  // zone hint for alerting
  if (alertBox) { x.fillStyle = 'rgba(255,95,86,.10)'; x.strokeStyle = 'rgba(255,95,86,.7)'; x.setLineDash([5, 4]); x.beginPath(); x.moveTo(W * 0.55, hz + 6); x.lineTo(W * 0.9, hz + 6); x.lineTo(W * 0.98, H * 0.95); x.lineTo(W * 0.5, H * 0.95); x.closePath(); x.fill(); x.stroke(); x.setLineDash([]); }
  // heat overlay
  if (cv.dataset.heat) {
    x.globalCompositeOperation = 'lighter';
    const hr = rng(7);
    for (let i = 0; i < 26; i++) {
      const cx = W * (0.25 + hr() * 0.55), cy = hz + (H - hz) * (0.15 + hr() * 0.8), rad = W * (0.04 + hr() * 0.09);
      const hg = x.createRadialGradient(cx, cy, 0, cx, cy, rad);
      const hot = hr() > 0.6;
      hg.addColorStop(0, hot ? 'rgba(255,95,86,.55)' : 'rgba(245,165,36,.35)'); hg.addColorStop(1, 'rgba(76,195,217,0)');
      x.fillStyle = hg; x.fillRect(cx - rad, cy - rad, rad * 2, rad * 2);
    }
    x.globalCompositeOperation = 'source-over';
  }
  // grain + vignette
  const n = (W * H) / 90;
  for (let i = 0; i < n; i++) { x.fillStyle = `rgba(255,255,255,${Math.random() * 0.05})`; x.fillRect(Math.random() * W, Math.random() * H, 1, 1); }
  const vg = x.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.55)'); x.fillStyle = vg; x.fillRect(0, 0, W, H);
}

function bars(vals, { w = 640, h = 190, labels = HOURS, every = 3, hi = -1, ghost = null, color = 'var(--accent)' } = {}) {
  const pl = 36, pb = 22, pt = 8, iw = w - pl - 4, ih = h - pb - pt;
  const { step, top } = nice(Math.max(...vals, ...(ghost || [0])));
  const bw = iw / vals.length;
  let s = `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img">`;
  for (let k = 0; k <= 4; k++) { const y = pt + ih - ih * k / 4; s += `<line x1="${pl}" x2="${w - 4}" y1="${y}" y2="${y}" stroke="var(--line)" ${k ? 'stroke-dasharray="2 4"' : ''}/><text x="${pl - 6}" y="${y + 3.5}" text-anchor="end">${fmt(step * k)}</text>`; }
  if (ghost) { let d = ''; ghost.forEach((v, i) => { const y = pt + ih - ih * v / top, xx = pl + i * bw + bw / 2; d += (i ? 'L' : 'M') + xx.toFixed(1) + ' ' + y.toFixed(1); }); s += `<path d="${d}" fill="none" stroke="var(--muted)" stroke-width="1.3" stroke-dasharray="3 3"/>`; }
  vals.forEach((v, i) => {
    const bh = ih * v / top, xx = pl + i * bw + bw * 0.18;
    const fill = i === hi ? color : (hi >= 0 && i > hi ? 'transparent' : color);
    const op = i === hi ? 1 : 0.55;
    if (v > 0) s += `<rect x="${xx.toFixed(1)}" y="${(pt + ih - bh).toFixed(1)}" width="${(bw * 0.64).toFixed(1)}" height="${bh.toFixed(1)}" rx="2" fill="${fill}" opacity="${op}"><title>${labels[i]}:00 · ${fmt(v)}</title></rect>`;
    if (i % every === 0) s += `<text x="${pl + i * bw + bw / 2}" y="${h - 6}" text-anchor="middle">${labels[i]}</text>`;
  });
  if (hi >= 0) { const xx = pl + hi * bw + bw / 2; s += `<line x1="${xx}" x2="${xx}" y1="${pt}" y2="${pt + ih}" stroke="var(--accent)" stroke-width="1" opacity=".5"/><text x="${xx + 5}" y="${pt + 9}" fill="var(--accent)" style="fill:var(--accent)">now</text>`; }
  return s + '</svg>';
}
function lines(series, labels, { w = 640, h = 200, every = 1, area = false } = {}) {
  const pl = 36, pb = 22, pt = 10, iw = w - pl - 10, ih = h - pb - pt;
  const { step, top } = nice(Math.max(...series.flatMap(s => s.v)));
  const n = labels.length, dx = iw / (n - 1);
  let s = `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img">`;
  for (let k = 0; k <= 4; k++) { const y = pt + ih - ih * k / 4; s += `<line x1="${pl}" x2="${w - 10}" y1="${y}" y2="${y}" stroke="var(--line)" ${k ? 'stroke-dasharray="2 4"' : ''}/><text x="${pl - 6}" y="${y + 3.5}" text-anchor="end">${fmt(Math.round(step * k * 10) / 10)}</text>`; }
  labels.forEach((l, i) => { if (i % every === 0 || i === n - 1) s += `<text x="${pl + i * dx}" y="${h - 6}" text-anchor="${i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}">${l}</text>`; });
  series.forEach((se, si) => {
    const pts = se.v.map((v, i) => [pl + i * dx, pt + ih - ih * v / top]);
    const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');
    if (area || se.area) s += `<defs><linearGradient id="g${si}${se.c.length}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${se.c}" stop-opacity=".35"/><stop offset="1" stop-color="${se.c}" stop-opacity="0"/></linearGradient></defs><path d="${d}L${pts.at(-1)[0]} ${pt + ih}L${pl} ${pt + ih}Z" fill="url(#g${si}${se.c.length})"/>`;
    s += `<path d="${d}" fill="none" stroke="${se.c}" stroke-width="${se.dash ? 1.4 : 2}" ${se.dash ? 'stroke-dasharray="4 4"' : ''} stroke-linejoin="round"/>`;
    const e = pts.at(-1); s += `<circle cx="${e[0]}" cy="${e[1]}" r="3.5" fill="${se.c}" stroke="var(--panel)" stroke-width="2"/>`;
  });
  return s + '</svg>';
}
function spark(v, color = 'var(--accent)') {
  const w = 160, h = 30, max = Math.max(...v), min = Math.min(...v), dx = w / (v.length - 1);
  const pts = v.map((y, i) => [i * dx, h - 3 - (h - 6) * (y - min) / (max - min || 1)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');
  const id = 'sp' + Math.random().toString(36).slice(2, 7);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".28"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="${d}L${w} ${h}L0 ${h}Z" fill="url(#${id})"/><path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`;
}

V.analytics = () => {
  const r = S.range;
  const L = r === '24h' ? HOURS : r === '7d' ? ['Fri', 'Sat', 'Sun', 'Mon', 'Tue', 'Wed', 'Thu'] : Array.from({ length: 30 }, (_, i) => i % 5 === 0 ? `Oct ${7 + i > 31 ? '' : 7 + i}` : '').map((x, i) => x || (i === 29 ? 'Nov 5' : ''));
  const n = L.length;
  const g = (base, amp, seed) => { const q = rng(seed); return Array.from({ length: n }, (_, i) => Math.max(0, Math.round(base + amp * Math.sin(i / n * Math.PI * (r === '24h' ? 2 : 4) - 1) + q() * amp * 0.5))); };
  const foot = r === '24h' ? YESTERDAY : g(1900, 500, 3);
  const veh = r === '24h' ? YESTERDAY.map(v => Math.round(v * 0.14)) : g(300, 80, 5);
  const qa = g(3, 2, 9), qm = qa.map(v => v + 3), occ = g(34, 8, 11), inc = g(2, 2, 13);
  const every = r === '24h' ? 3 : r === '7d' ? 1 : 5;
  return `
  <div class="page-head"><div><h1>Analytics</h1><p class="sub">People, vehicles, queues and occupancy across your cameras</p></div><div class="actions"><a class="btn" href="#reports">${ic('file')}Make a report from this view</a></div></div>
  <div class="filterbar">
    <select class="input" aria-label="Camera"><option>All cameras</option>${CAMS.map(c => `<option>${c.name}</option>`).join('')}</select>
    <div class="seg">${[['24h', 'Last 24 h'], ['7d', 'Last 7 days'], ['30d', 'Last 30 days']].map(([k, l]) => `<button class="${r === k ? 'on' : ''}" data-range="${k}">${l}</button>`).join('')}</div>
    <span class="muted" style="font-size:12.5px;margin-left:auto">Compared with the previous ${r === '24h' ? '24 hours' : r === '7d' ? '7 days' : '30 days'}</span>
  </div>
  <section class="summary">
    <div class="kpi"><span class="lbl">Footfall</span><span class="val">${fmt(foot.reduce((a, b) => a + b, 0))}</span><span class="d up">▲ 6.2%</span></div>
    <div class="kpi"><span class="lbl">Vehicles</span><span class="val">${fmt(veh.reduce((a, b) => a + b, 0))}</span><span class="d down">▼ 3.9%</span></div>
    <div class="kpi"><span class="lbl">Peak queue</span><span class="val">${Math.max(...qm)}</span><span class="d flat">Cafeteria · 12:41</span></div>
    <div class="kpi"><span class="lbl">Incidents</span><span class="val">${inc.reduce((a, b) => a + b, 0)}</span><span class="d up">▼ 11%</span></div>
  </section>
  <div class="charts">
    <section class="panel"><div class="panel-h"><h2>Footfall</h2></div><div class="panel-b">${lines([{ v: foot, c: 'var(--accent)', area: true }], L, { every })}</div></section>
    <section class="panel"><div class="panel-h"><h2>Vehicles</h2></div><div class="panel-b">${bars(veh, { labels: L, every, color: 'var(--warn)', h: 200 })}</div></section>
    <section class="panel"><div class="panel-h"><h2>Queue length</h2><div class="legend"><span><i style="background:var(--info)"></i>Average</span><span><i style="background:var(--crit)"></i>Max</span></div></div><div class="panel-b">${lines([{ v: qa, c: 'var(--info)' }, { v: qm, c: 'var(--crit)', dash: true }], L, { every })}</div></section>
    <section class="panel"><div class="panel-h"><h2>Occupancy and incidents</h2><div class="legend"><span><i style="background:var(--ok)"></i>Avg occupancy</span><span><i style="background:var(--crit)"></i>Incidents</span></div></div><div class="panel-b">${lines([{ v: occ, c: 'var(--ok)', area: true }, { v: inc, c: 'var(--crit)' }], L, { every })}</div></section>
  </div>
  <section class="panel"><div class="panel-h"><h2>Movement heatmap · Loading Dock B</h2><span class="muted mono" style="font-size:11.5px">last hour</span></div>
    <div class="panel-b heat">${feed('cam-dock-b', { bare: true, heat: true, alert: false })}
      <div style="display:flex;flex-direction:column;gap:14px">
        <p class="ink2">Most movement sits on the dock apron and the path to the cage door. The cage itself should be empty outside loading windows.</p>
        <div><div class="scale"></div><div style="display:flex;justify-content:space-between;font-size:11.5px" class="muted mono"><span>low</span><span>high</span></div></div>
        <dl class="kv"><div><dt>Busiest cell</dt><dd>Dock door 3 approach</dd></div><div><dt>Dwell &gt; 30 s</dt><dd class="mono">14 tracks</dd></div></dl>
      </div>
    </div>
  </section>`;
};

  dashboard: ['Status strip at the top answers "is anything wrong right now?" before any numbers.', 'KPI tiles gain 7-point sparklines and plain-language deltas.', 'Footfall chart overlays yesterday as a dashed line and marks the current hour.', 'New "incidents today by type" breakdown in the right rail.'],
  cameras: ['Filter chips with counts (All / Online / Offline / Uploads).', 'Each card shows health (fps, reconnects, rules) in a fixed footer, so it lines up.', 'Zones and rules open in a side panel instead of a modal, so the grid stays visible.'],
  alerts: ['Becomes a triage inbox: list on the left, snapshot and context on the right.', 'Grouped by Now / Earlier today, with unread dots.', 'Clear actions: escalate, acknowledge, dismiss as false alarm.'],
  incidents: ['Status tabs double as counters.', 'Severity stripe, age column (amber once past the 30-min target) and assignee avatars.', 'Detail moves from a modal to a side panel with an activity timeline.'],
  analytics: ['One filter bar with segmented time ranges.', 'Summary row before the charts.', 'Heatmap drawn over the camera frame with a short reading of it.'],
  reports: ['List with a live preview of what the PDF contains.', 'Time window shown on each report.'],
  investigations: ['Query builder plus removable filter chips.', 'Detections-over-time chart for narrowing the range.', 'Plates styled like plates; confidence as a bar.'],
  assistant: ['Chat layout with answers as tables; SQL tucked behind "Show the query".', 'Suggestions, insights and the privacy promise in a side rail.'],
  admin: ['Split into tabs: System health, Users and roles, Footage upload.', 'Health cards with status dots; agent CPU, memory and disk as meters.', 'Role pills with a one-line explanation of each role.'],
  login: ['Split screen: live camera mosaic and product promise on the left, short form on the right.'],
};

/* ======================= render ======================= */
let route = 'dashboard';
function render() {
  const h = (location.hash || '#dashboard').slice(1);
  route = V[h] ? h : 'dashboard';
  const app = document.getElementById('app');
  const inner = V[route]();
  app.innerHTML = (route === 'login' ? inner : shell(route, inner)) + notesHtml();
  document.title = 'Iso Safe Redesign Preview';
  requestAnimationFrame(() => drawAll(performance.now()));
  window.scrollTo(0, 0);
}
function notesHtml() {
  const n = NOTES[route] || [];
  return `<aside class="notes ${S.notesOpen ? '' : 'min'}" aria-label="Design notes"><div class="notes-h"><b>${ic('layers')}What changed on this page</b><button class="iconbtn" style="width:26px;height:26px" data-act="notes" aria-label="${S.notesOpen ? 'Collapse' : 'Expand'} design notes">${ic(S.notesOpen ? 'x' : 'plus')}</button></div><ul>${n.map(x => `<li>${x}</li>`).join('')}</ul></aside>`;
}
function drawAll(t) { document.querySelectorAll('canvas[data-feed]').forEach(cv => drawFeed(cv, t)); }
function rerender() { const y = window.scrollY; const app = document.getElementById('app'); const inner = V[route](); app.innerHTML = (route === 'login' ? inner : shell(route, inner)) + notesHtml(); requestAnimationFrame(() => { drawAll(performance.now()); window.scrollTo(0, y); }); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-cam],[data-camtab],[data-camf],[data-alert],[data-alf],[data-inc],[data-inctab],[data-range],[data-rep],[data-admintab],[data-act],[data-ask],[data-go-alert]');
  if (!el) return;
  const d = el.dataset;
  if (d.goAlert) { S.alert = Number(d.goAlert); return; }
  if (d.cam) S.cam = d.cam;
  else if (d.camtab) S.camTab = d.camtab;
  else if (d.camf) S.camFilter = d.camf;
  else if (d.alert) S.alert = Number(d.alert);
  else if (d.alf) S.alertFilter = d.alf;
  else if (d.inc) S.inc = Number(d.inc);
  else if (d.inctab) { S.incTab = d.inctab; S.inc = (INCIDENTS.find(i => i.status === d.inctab) || {}).id; }
  else if (d.range) S.range = d.range;
  else if (d.rep) S.report = d.rep;
  else if (d.admintab) S.adminTab = d.admintab;
  else if (d.ask) S.chat.push(d.ask);
  else if (d.act === 'notes') S.notesOpen = !S.notesOpen;
  else if (d.act === 'nav') S.navOpen = !S.navOpen;
  else return;
  rerender();
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('[data-inc],[data-rep]')) e.target.click(); });
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target.dataset.form;
  if (f === 'ask') { const v = document.getElementById('ask').value.trim(); if (v) { S.chat.push(v.replace(/[<>&]/g, '')); rerender(); } }
  if (f === 'login') location.hash = '#dashboard';
});
window.addEventListener('hashchange', () => { S.navOpen = false; render(); });
window.addEventListener('resize', () => drawAll(performance.now()));

// live clock (fixed sample start 14:32:07) + gentle feed motion
const start = Date.now();
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
setInterval(() => {
  const s = 14 * 3600 + 32 * 60 + 7 + Math.floor((Date.now() - start) / 1000);
  const hh = String(Math.floor(s / 3600) % 24).padStart(2, '0'), mm = String(Math.floor(s / 60) % 60).padStart(2, '0'), ss = String(s % 60).padStart(2, '0');
  document.querySelectorAll('[data-clock]').forEach(n => n.textContent = `${hh}:${mm}:${ss}`);
  document.querySelectorAll('[data-clock-full]').forEach(n => n.textContent = `Thu 5 Nov · ${hh}:${mm}:${ss}`);
  if (!reduce) drawAll(performance.now());
}, 1000);

render();
</script>
</body>
</html>

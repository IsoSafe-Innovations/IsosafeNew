worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/isosafe/http.conf;

    # Redirect HTTP to HTTPS when certs are present; comment the below server
    # block and uncomment the plain one for cert-less LAN deployments.
    server {
        listen 80;
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;

        include /etc/nginx/isosafe/proxy-locations.conf;

        # Site agent uplink (agent mode): control WS + config/incidents/heartbeat.
        location /agent/v1/stream {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /agent/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-ID $request_id;
        }

        location /media/ {
            alias /data/media/;
            expires 1h;
        }
    }
}

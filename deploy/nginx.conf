worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/isosafe/http.conf;

    # Redirect HTTP to HTTPS when certs are present; comment the below server
    # block and uncomment the plain one for cert-less LAN deployments.
    server {
        listen 80;
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;

        include /etc/nginx/isosafe/proxy-locations.conf;

        location /media/ {
            alias /data/media/;
            expires 1h;
        }
    }
}

# Public HTTPS front door for the cloud VM (infra/demo). Used by
# docker-compose.aws.yml. TLS certs are copied by deploy/first_deploy.sh to
# deploy/certs/server.{crt,key} (certbot live certs -> mounted /etc/nginx/certs).
#
# Lockdowns vs the LAN nginx.conf:
#   * /media/ 404s - snapshots live privately in S3 and are served only via
#     short-lived presigned URLs (PRD DG4 / DEMO-NFR-05). The old v1 public
#     media route must not exist in the cloud.
#   * ACME webroot for Let's Encrypt (HTTP-01) before the 80->443 redirect.
#   * TLS on 443, HTTP->HTTPS on 80, HSTS + XSS/clickjacking headers.

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    server_tokens off;
    # WebSocket tokens are query parameters: never write query strings to logs.
    log_format safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log safe;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    client_max_body_size 512m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    upstream frontend {
        server frontend:80;
    }

    # Redirect HTTP to HTTPS; answer ACME challenges on 80 first.
    server {
        listen 80;

        location /.well-known/acme-challenge/ {
            root /var/www/acme/;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;

        location /.well-known/acme-challenge/ {
            root /var/www/acme/;
        }

        location /api/ws {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location = /api/metrics {
            return 404;
        }

        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-ID $request_id;
        }

        # Site agent uplink (agent mode): the agent in the customer network
        # reaches the cloud only through this public front door. Long-lived
        # control channel is a WebSocket; config/incidents/heartbeat are REST.
        location /agent/v1/stream {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /agent/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-ID $request_id;
        }

        # Cloud lockdown: no public /media route (snapshots via presigned S3).
        location /media/ {
            return 404;
        }

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
        }
    }
}

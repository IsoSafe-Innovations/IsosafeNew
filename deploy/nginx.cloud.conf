# Public HTTPS front door for the cloud VM (infra/demo). Used by
# docker-compose.aws.yml. TLS certs are copied by deploy/first_deploy.sh to
# deploy/certs/server.{crt,key} (certbot live certs -> mounted /etc/nginx/certs).
#
# Lockdowns vs the LAN nginx.conf:
#   * /media/ 404s - snapshots live privately in S3 and are served only via
#     short-lived presigned URLs (PRD DG4 / DEMO-NFR-05). The old v1 public
#     media route must not exist in the cloud.
#   * ACME webroot for Let's Encrypt (HTTP-01) before the 80->443 redirect.
#   * TLS on 443, HTTP->HTTPS on 80, HSTS + XSS/clickjacking headers.

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    server_tokens off;
    # WebSocket tokens are query parameters: never write query strings to logs.
    log_format safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log safe;
    include /etc/nginx/isosafe/http.conf;

    # Redirect HTTP to HTTPS; answer ACME challenges on 80 first.
    server {
        listen 80;

        location /.well-known/acme-challenge/ {
            root /var/www/acme/;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;

        location /.well-known/acme-challenge/ {
            root /var/www/acme/;
        }

        location = /api/metrics {
            return 404;
        }

        include /etc/nginx/isosafe/proxy-locations.conf;

        # Cloud lockdown: no public /media route (snapshots via presigned S3).
        location /media/ {
            return 404;
        }
    }
}

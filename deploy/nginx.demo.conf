worker_processes auto;

events {
    worker_connections 4096;
}

# Plain-HTTP demo front door (no TLS). Used by docker-compose.demo.yml so the
# dashboard and the presigned MinIO URLs share an http origin (no mixed content).
http {
    include /etc/nginx/isosafe/http.conf;

    server {
        listen 80;

        include /etc/nginx/isosafe/proxy-locations.conf;

        # Staging lockdown: the old public media route must 404 (PRD Phase 1a).
        location /media/ {
            return 404;
        }
    }
}

# Shared http context for every edge nginx config.
# Mounted by compose at /etc/nginx/isosafe/http.conf.

include /etc/nginx/mime.types;
default_type application/octet-stream;
sendfile on;
client_max_body_size 512m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream backend {
    server backend:8000;
    keepalive 32;
}

upstream frontend {
    server frontend:80;
}

# Disposable local verification services. No connection to the application stack.
# docker compose -p isosafe-youtube-check -f deploy/test-youtube.compose.yml up -d
services:
  database:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: verification
      POSTGRES_PASSWORD: verification-only
      POSTGRES_DB: verification
    ports: ["127.0.0.1:15439:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verification"]
      interval: 2s
      retries: 30
  cache:
    image: redis:7-alpine
    ports: ["127.0.0.1:16389:6379"]

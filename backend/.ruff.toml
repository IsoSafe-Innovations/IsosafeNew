line-length = 120
target-version = "py312"

[lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long
    "E722",  # bare except
    "F541",  # f-string without placeholders
]

[lint.per-file-ignores]
"tests/*.py" = ["E501", "F541"]
